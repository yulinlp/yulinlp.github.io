name: Update Scholar and deploy website
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: website-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        if: github.event_name != 'push'
        run: pip install -r google_scholar_crawler/requirements.txt
      - name: Test data merging
        run: python3 -m unittest discover -s google_scholar_crawler -p "test_*.py"
      - name: Refresh Scholar
        id: scholar
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 5
        run: python google_scholar_crawler/main.py
      - name: Save refreshed data
        if: steps.scholar.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/publications.json _data/scholar_metrics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Google Scholar publications and citations'
            git push
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Report Scholar failure
        if: steps.scholar.outcome == 'failure'
        run: echo '::warning::Google Scholar refresh failed. The previous data was preserved.'
    outputs:
      scholar_failed: ${{ steps.scholar.outcome == 'failure' }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Flag failed refresh after deploying saved data
        if: needs.build.outputs.scholar_failed == 'true'
        run: exit 1
